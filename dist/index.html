<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e31b23" />
    <meta name="description" content="Hall of Fame — an interactive journey through 10 artists and 50 essential songs." />
    <title>HALL//50 — Music Hall of Fame</title>
    <meta name="referrer" content="no-referrer" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Hall 50 home">
        <span class="brand-mark">H//</span><span>HALL <b>50</b></span>
      </a>
      <div class="top-actions">
        <label class="lang-wrap">
          <span class="sr-only" data-i18n="language">Sprache</span>
          <select id="language" aria-label="Sprache">
            <option value="de">DE</option>
            <option value="en">EN</option>
            <option value="zh">中文</option>
          </select>
        </label>
        <button class="icon-button sound-toggle" id="soundToggle" type="button" aria-pressed="false">
          <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span data-i18n="soundOff">Ambiente aus</span>
        </button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer class="site-footer">
      <p data-i18n="independent"></p>
      <nav><a href="https://github.com/codetraveller66/hall_of_fame_music" target="_blank" rel="noopener noreferrer">GitHub ↗</a><a href="https://github.com/codetraveller66/hall_of_fame_music/blob/main/NOTICE.md" target="_blank" rel="noopener noreferrer" data-i18n="rights"></a></nav>
      <details id="photoCredits"><summary data-i18n="photoCredits"></summary><p data-i18n="photoChanges"></p><ul id="photoCreditList"></ul></details>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="page-wipe" id="pageWipe" aria-hidden="true">
      <i></i><i></i><i></i><i></i>
      <strong id="wipeLabel">HALL//50</strong>
    </div>
    <script src="data.js"></script>
    <script src="media.js"></script>
    <script src="app.js"></script>
  </body>
</html>
