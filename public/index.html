<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e31b23" />
    <meta name="description" content="Hall of Fame — an interactive journey through 10 artists and 50 essential songs." />
    <title>HALL//50 — Music Hall of Fame</title>
    <link rel="preconnect" href="https://itunes.apple.com" />
    <link rel="preconnect" href="https://en.wikipedia.org" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Hall 50 home">
        <span class="brand-mark">H//</span><span>HALL <b>50</b></span>
      </a>
      <div class="top-actions">
        <label class="lang-wrap">
          <span class="sr-only" data-i18n="language">Sprache</span>
          <select id="language" aria-label="Sprache">
            <option value="de">DE</option>
            <option value="en">EN</option>
            <option value="zh">中文</option>
          </select>
        </label>
        <button class="icon-button sound-toggle" id="soundToggle" type="button" aria-pressed="false">
          <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span data-i18n="soundOff">Sound aus</span>
        </button>
        <button class="icon-button" id="shareButton" type="button">
          <span aria-hidden="true">↗</span><span data-i18n="share">Teilen</span>
        </button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <div class="audio-dock" id="audioDock" hidden>
      <div class="now-art" id="nowArt"></div>
      <div class="now-copy">
        <small data-i18n="nowPlaying">JETZT</small>
        <strong id="nowTitle">—</strong>
        <span id="nowArtist">—</span>
      </div>
      <div class="equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <button id="dockPlay" class="dock-play" type="button" aria-label="Pause">Ⅱ</button>
      <button id="dockNext" class="dock-next" type="button" aria-label="Nächster Titel">›</button>
      <audio id="audio" preload="none"></audio>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
